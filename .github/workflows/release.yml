name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Inject version banner
        run: sed -i "1s|^|// VisualEditor ${{ github.ref_name }}\n|" dist/VisualEditor.standalone.js

      - name: Upload release assets
        run: gh release upload "${{ github.ref_name }}" dist/VisualEditor.standalone.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
